name: one-shot-dhan-policy-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/runtime/dhan_learning_daemon.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "        self.coordinator = coordinator\n        self.history_client = history_client\n": (
                  "        self.coordinator = coordinator\n"
                  "        self.agent_risk_policy = (\n"
                  "            coordinator.scanner.agent_risk_policy or AgentRiskPolicy()\n"
                  "        )\n"
                  "        self.history_client = history_client\n"
              ),
              "        team = build_brain_policy_team(firewall, policy)\n": (
                  "        team = build_brain_policy_team(\n"
                  "            firewall,\n"
                  "            policy,\n"
                  "            risk_policy=self.agent_risk_policy,\n"
                  "            min_top_of_book_notional=1.0,\n"
                  "        )\n"
              ),
              "            max_slippage_bps=config.max_slippage_bps,\n": (
                  "            max_estimated_slippage_bps=config.max_slippage_bps,\n"
              ),
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one_shot_dhan_patch.yml").unlink()
      - name: Commit patch and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura/runtime/dhan_learning_daemon.py .github/workflows/one_shot_dhan_patch.yml
          git commit -m "preserve Dhan execution policy across brain evolution"
          git push
