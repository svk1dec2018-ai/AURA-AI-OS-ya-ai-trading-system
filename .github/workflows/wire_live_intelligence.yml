name: wire-live-intelligence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded intelligence wiring
        shell: python
        run: |
          from pathlib import Path

          def once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          # Macro specialist: structured external intelligence fallback.
          once(
              "aura/agents/external_specialists.py",
              "from aura.domain.models import NormalizedCandle, SignalIntent\n",
              "from aura.data.free_intelligence import ExternalIntelligenceEvent, IntelligenceKind\n"
              "from aura.domain.models import NormalizedCandle, SignalIntent\n",
          )
          once(
              "aura/agents/external_specialists.py",
              "        if not bundle.items:\n"
              "            return self._abstain(context, \"no trusted point-in-time macro knowledge\", \"macro_missing\")\n",
              "        if not bundle.items:\n"
              "            return self._analyze_external_intelligence(context)\n",
          )
          once(
              "aura/agents/external_specialists.py",
              "    def _abstain(self, context: AgentContext, thesis: str, flag: str) -> AgentEvidence:\n"
              "        return _abstain(\n"
              "            agent_id=self.agent_id,\n"
              "            role=self.role,\n"
              "            context=context,\n"
              "            thesis=thesis,\n"
              "            flag=flag,\n"
              "            source_type=EvidenceSourceType.RESEARCH,\n"
              "            source_id=\"knowledge-firewall:abstention\",\n"
              "        )\n",
              "    def _analyze_external_intelligence(self, context: AgentContext) -> AgentEvidence:\n"
              "        raw = context.metadata.get(\"external_intelligence_events\")\n"
              "        if not raw:\n"
              "            return self._abstain(\n"
              "                context,\n"
              "                \"no trusted point-in-time macro/news intelligence\",\n"
              "                \"macro_missing\",\n"
              "            )\n"
              "        events = tuple(ExternalIntelligenceEvent.model_validate(item) for item in raw)\n"
              "        if any(\n"
              "            item.published_at > context.created_at\n"
              "            or item.observed_at > context.created_at\n"
              "            for item in events\n"
              "        ):\n"
              "            return self._abstain(\n"
              "                context,\n"
              "                \"external macro/news intelligence contains future data\",\n"
              "                \"macro_future_data\",\n"
              "            )\n"
              "        visible = tuple(item for item in events if item.trust_score >= 0.6)\n"
              "        if not visible:\n"
              "            return self._abstain(\n"
              "                context,\n"
              "                \"external macro/news intelligence is below trust threshold\",\n"
              "                \"macro_missing\",\n"
              "            )\n"
              "        flags: list[str] = []\n"
              "        if any(item.kind == IntelligenceKind.CENTRAL_BANK for item in visible):\n"
              "            flags.append(\"fresh_central_bank_event\")\n"
              "        if any(item.kind == IntelligenceKind.REGULATORY for item in visible):\n"
              "            flags.append(\"fresh_regulatory_event\")\n"
              "        directional = tuple(item for item in visible if item.sentiment is not None)\n"
              "        if directional:\n"
              "            total_trust = sum(item.trust_score for item in directional)\n"
              "            score = (\n"
              "                sum(float(item.sentiment) * item.trust_score for item in directional)\n"
              "                / total_trust\n"
              "                if total_trust > 0\n"
              "                else 0.0\n"
              "            )\n"
              "            flags.append(\"external_intelligence_sentiment\")\n"
              "            if score >= 0.2:\n"
              "                intent = SignalIntent.LONG\n"
              "            elif score <= -0.2:\n"
              "                intent = SignalIntent.SHORT\n"
              "            else:\n"
              "                intent = SignalIntent.FLAT\n"
              "            confidence = min(abs(score), 1.0) if intent != SignalIntent.FLAT else 0.0\n"
              "            thesis = (\n"
              "                f\"sourced external intelligence sentiment={score:.3f} \"\n"
              "                f\"across {len(directional)} events\"\n"
              "            )\n"
              "        else:\n"
              "            intent = SignalIntent.FLAT\n"
              "            confidence = 0.0\n"
              "            thesis = (\n"
              "                f\"{len(visible)} fresh trusted macro/regulatory events; \"\n"
              "                \"no explicit directional sentiment supplied\"\n"
              "            )\n"
              "        return AgentEvidence(\n"
              "            agent_id=self.agent_id,\n"
              "            role=self.role,\n"
              "            intent=intent,\n"
              "            confidence=confidence,\n"
              "            thesis=thesis,\n"
              "            risk_flags=tuple(sorted(set(flags))),\n"
              "            sources=tuple(\n"
              "                EvidenceSource(\n"
              "                    source_id=item.event_id,\n"
              "                    source_type=(\n"
              "                        EvidenceSourceType.MACRO\n"
              "                        if item.kind in {\n"
              "                            IntelligenceKind.MACRO,\n"
              "                            IntelligenceKind.CENTRAL_BANK,\n"
              "                        }\n"
              "                        else EvidenceSourceType.NEWS\n"
              "                    ),\n"
              "                    observed_at=item.observed_at,\n"
              "                    trust_score=item.trust_score,\n"
              "                )\n"
              "                for item in visible\n"
              "            ),\n"
              "            features={\n"
              "                \"external_event_count\": len(visible),\n"
              "                \"explicit_sentiment_count\": len(directional),\n"
              "            },\n"
              "            generated_at=context.created_at,\n"
              "        )\n\n"
              "    def _abstain(self, context: AgentContext, thesis: str, flag: str) -> AgentEvidence:\n"
              "        return _abstain(\n"
              "            agent_id=self.agent_id,\n"
              "            role=self.role,\n"
              "            context=context,\n"
              "            thesis=thesis,\n"
              "            flag=flag,\n"
              "            source_type=EvidenceSourceType.RESEARCH,\n"
              "            source_id=\"knowledge-firewall:abstention\",\n"
              "        )\n",
          )
          once(
              "aura/agents/risk_policy.py",
              '            "macro_contradiction",\n',
              '            "macro_contradiction",\n            "macro_future_data",\n',
          )

          # Dhan intelligence service lifecycle and metadata.
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "from aura.data.dhan_universe_planner import DhanUniversePlanner, DhanUniversePolicy\n",
              "from aura.data.dhan_universe_planner import DhanUniversePlanner, DhanUniversePolicy\n"
              "from aura.data.intelligence_service import LiveIntelligenceService\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "        option_service: DhanOptionContextService,\n"
              "        radar: DhanOpportunityRadar,\n",
              "        option_service: DhanOptionContextService,\n"
              "        intelligence_service: LiveIntelligenceService,\n"
              "        radar: DhanOpportunityRadar,\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "        self.option_service = option_service\n"
              "        self.radar = radar\n",
              "        self.option_service = option_service\n"
              "        self.intelligence_service = intelligence_service\n"
              "        self.radar = radar\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "        self._stop.clear()\n"
              "        await self.coordinator.start()\n",
              "        self._stop.clear()\n"
              "        await self.intelligence_service.start()\n"
              "        await self.coordinator.start()\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "            await self.option_service.stop()\n",
              "            await self.option_service.stop()\n"
              "            await self.intelligence_service.stop()\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              '            "option_context": self.option_service.status(),\n',
              '            "option_context": self.option_service.status(),\n'
              '            "live_intelligence": self.intelligence_service.status(),\n',
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "    option_service = DhanOptionContextService(\n"
              "        credentials,\n"
              "        DhanOptionTargetResolver(universe),\n"
              "    )\n",
              "    option_service = DhanOptionContextService(\n"
              "        credentials,\n"
              "        DhanOptionTargetResolver(universe),\n"
              "    )\n"
              "    intelligence_service = LiveIntelligenceService(\n"
              "        include_official_india=True,\n"
              "        gdelt_queries=(\"India stock market\", \"Reserve Bank of India\", \"SEBI\"),\n"
              "    )\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "            option_service,\n"
              "            candle.symbol,\n"
              "            decision_time,\n",
              "            option_service,\n"
              "            intelligence_service,\n"
              "            candle.symbol,\n"
              "            decision_time,\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "        option_service=option_service,\n"
              "        radar=radar,\n",
              "        option_service=option_service,\n"
              "        intelligence_service=intelligence_service,\n"
              "        radar=radar,\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "    option_service: DhanOptionContextService,\n"
              "    symbol: str,\n",
              "    option_service: DhanOptionContextService,\n"
              "    intelligence_service: LiveIntelligenceService,\n"
              "    symbol: str,\n",
          )
          once(
              "aura/runtime/dhan_learning_daemon.py",
              "    metadata.update(\n"
              "        option_service.metadata_for(\n"
              "            symbol,\n"
              "            decision_time=decision_time,\n"
              "        )\n"
              "    )\n"
              "    return metadata\n",
              "    metadata.update(\n"
              "        option_service.metadata_for(\n"
              "            symbol,\n"
              "            decision_time=decision_time,\n"
              "        )\n"
              "    )\n"
              "    metadata.update(\n"
              "        intelligence_service.metadata_for(\n"
              "            symbol,\n"
              "            decision_time=decision_time,\n"
              "        )\n"
              "    )\n"
              "    return metadata\n",
          )

          # MT5 self-evolving live intelligence lifecycle and metadata wrapper.
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "from aura.evolution.brain_online import (\n",
              "from aura.data.intelligence_service import LiveIntelligenceService\n"
              "from aura.evolution.brain_online import (\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "        online_bridge: OpportunityOnlineLearningBridge,\n"
              "        research_every_new_samples: int = 100,\n",
              "        online_bridge: OpportunityOnlineLearningBridge,\n"
              "        intelligence_service: LiveIntelligenceService,\n"
              "        research_every_new_samples: int = 100,\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "        self.online_bridge = online_bridge\n"
              "        self.research_every_new_samples = research_every_new_samples\n",
              "        self.online_bridge = online_bridge\n"
              "        self.intelligence_service = intelligence_service\n"
              "        self.research_every_new_samples = research_every_new_samples\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "        await self.base.coordinator.start()\n",
              "        await self.intelligence_service.start()\n"
              "        await self.base.coordinator.start()\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "                await self.base.coordinator.stop()\n"
              "                self.base.gateway.shutdown()\n",
              "                await self.base.coordinator.stop()\n"
              "                await self.intelligence_service.stop()\n"
              "                self.base.gateway.shutdown()\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              '            "online_learning": self.online_bridge.status(),\n',
              '            "online_learning": self.online_bridge.status(),\n'
              '            "live_intelligence": self.intelligence_service.status(),\n',
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "    online_bridge = OpportunityOnlineLearningBridge(\n"
              "        SafeOnlineLearner(),\n"
              "        market=\"MT5_CFD\",\n"
              "    )\n",
              "    online_bridge = OpportunityOnlineLearningBridge(\n"
              "        SafeOnlineLearner(),\n"
              "        market=\"MT5_CFD\",\n"
              "    )\n"
              "    intelligence_service = LiveIntelligenceService(\n"
              "        include_official_india=False,\n"
              "        gdelt_queries=(\"forex\", \"gold\", \"oil\", \"central bank\"),\n"
              "    )\n"
              "    prior_metadata_provider = base.coordinator.metadata_provider\n"
              "    base.coordinator.metadata_provider = (\n"
              "        lambda candle, history, decision_time: _mt5_decision_metadata(\n"
              "            prior_metadata_provider,\n"
              "            intelligence_service,\n"
              "            candle,\n"
              "            history,\n"
              "            decision_time,\n"
              "        )\n"
              "    )\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "        online_bridge=online_bridge,\n"
              "        research_every_new_samples=research_every_new_samples,\n",
              "        online_bridge=online_bridge,\n"
              "        intelligence_service=intelligence_service,\n"
              "        research_every_new_samples=research_every_new_samples,\n",
          )
          once(
              "aura/runtime/mt5_learning_daemon.py",
              "\ndef _metric_payload(metric) -> dict:\n",
              "\ndef _mt5_decision_metadata(\n"
              "    prior_provider,\n"
              "    intelligence_service: LiveIntelligenceService,\n"
              "    candle,\n"
              "    history,\n"
              "    decision_time: datetime,\n"
              ") -> dict:\n"
              "    metadata = (\n"
              "        prior_provider(candle, history, decision_time)\n"
              "        if prior_provider is not None\n"
              "        else {}\n"
              "    )\n"
              "    metadata.update(\n"
              "        intelligence_service.metadata_for(\n"
              "            candle.symbol,\n"
              "            decision_time=decision_time,\n"
              "        )\n"
              "    )\n"
              "    return metadata\n\n\n"
              "def _metric_payload(metric) -> dict:\n",
          )

          # Catalog truth for concrete adapters.
          path = Path("aura/connectors/catalog.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            connector_id="flattrade",\n            display_name="Flattrade Pi",\n            kind=_BROKER,\n            regions=("INDIA",),\n            markets=("NSE", "BSE", "NFO", "CDS", "MCX"),\n            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.OPTIONS, Capability.OPTION_CHAIN, Capability.OPEN_INTEREST}),\n            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,\n            maturity=ConnectorMaturity.RESEARCHED,\n            notes=("Pi v2 execution use is subject to current exchange approval/static-IP rules.",),',
              '            connector_id="flattrade",\n            display_name="Flattrade Pi",\n            kind=_BROKER,\n            regions=("INDIA",),\n            markets=("NSE", "BSE", "NFO", "CDS", "MCX"),\n            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.OPTIONS, Capability.OPTION_CHAIN, Capability.OPEN_INTEREST}),\n            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,\n            maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,\n            required_env=("AURA_FLATTRADE_USER_ID", "AURA_FLATTRADE_ACCOUNT_ID", "AURA_FLATTRADE_ACCESS_TOKEN"),\n            notes=("AURA implements Pi v2 live touchline and TPSeries market data; execution remains disabled pending reconciliation/static-IP validation.",),',
          )
          text = text.replace(
              '            connector_id="oanda_v20",\n            display_name="OANDA v20 REST API",\n            kind=_BROKER,\n            regions=("GLOBAL",),\n            markets=("FOREX", "CFD"),\n            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.DEMO}),\n            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,\n            maturity=ConnectorMaturity.RESEARCHED,',
              '            connector_id="oanda_v20",\n            display_name="OANDA v20 REST API",\n            kind=_BROKER,\n            regions=("GLOBAL",),\n            markets=("FOREX", "CFD"),\n            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.DEMO}),\n            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,\n            maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,\n            required_env=("AURA_OANDA_ACCOUNT_ID", "AURA_OANDA_ACCESS_TOKEN"),\n            notes=("AURA implements read-only v20 practice/live pricing and candles; order routing remains disabled.",),',
          )
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/wire_live_intelligence.yml").unlink()
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate and capture
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/ruff_fix 2>&1
          RUFF_FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${RUFF_FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 140 /tmp/pytest
          } > wire_live_intelligence_result.txt
      - name: Commit patch and result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests .github/workflows/wire_live_intelligence.yml wire_live_intelligence_result.txt
          git commit -m "wire live sourced intelligence into AURA decisions"
          git push
