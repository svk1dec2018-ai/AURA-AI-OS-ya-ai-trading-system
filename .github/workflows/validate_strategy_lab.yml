name: validate-strategy-lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate strategy lab batch
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 160 /tmp/pytest
          } > strategy_lab_validation.txt
      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/validate_strategy_lab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_lab_validation.txt .github/workflows/validate_strategy_lab.yml
          git commit -m "record strategy lab validation"
          git push
