name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate deterministic governance evidence
        run: |
          python -m aura.ops.repository_audit
          python -m aura.ops.core_contracts --write
          python -m aura.ops.state_engine_gate --write
          python -m aura.ops.risk_engine_gate --write
          python -m aura.ops.broker_conformance_gate --write
          python -m aura.ops.market_data_gate --write
          python -m aura.ops.backtest_gate --write
          python -m aura.ops.strategy_research_gate --write
          python -m aura.ops.knowledge_rag_gate --write
          python -m aura.ops.multi_agent_gate --write
          python -m aura.ops.ceo_decision_gate --write
          python -m aura.ops.broker_evidence_readiness --write
          python -m aura.ops.paper_trading_gate --write
          python -m aura.ops.operator_interface_gate --write
          python -m aura.ops.end_to_end_gate --write
      - name: Commit refreshed evidence when needed
        id: sync
        shell: bash
        run: |
          git add artifacts/governance
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "aura-governance-bot"
          git config user.email "aura-governance-bot@users.noreply.github.com"
          git commit -m "Refresh deterministic governance evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: governance-sync
    if: >-
      ${{ always() &&
          (needs.governance-sync.result == 'success' || needs.governance-sync.result == 'skipped') &&
          needs.governance-sync.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile smoke
        run: python -m compileall -q aura examples
      - name: Phase 0 audit drift
        run: python -m aura.ops.repository_audit --check
      - name: Phase 1 contract evidence drift
        run: python -m aura.ops.core_contracts --check
      - name: Phase 2 state engine evidence drift
        run: python -m aura.ops.state_engine_gate --check
      - name: Phase 3 risk engine evidence drift
        run: python -m aura.ops.risk_engine_gate --check
      - name: Phase 4 broker conformance evidence drift
        run: python -m aura.ops.broker_conformance_gate --check
      - name: Phase 5 market-data evidence drift
        run: python -m aura.ops.market_data_gate --check
      - name: Phase 6 backtest evidence drift
        run: python -m aura.ops.backtest_gate --check
      - name: Phase 7 strategy research evidence drift
        run: python -m aura.ops.strategy_research_gate --check
      - name: Phase 8 knowledge/RAG evidence drift
        run: python -m aura.ops.knowledge_rag_gate --check
      - name: Phase 9 multi-agent evidence drift
        run: python -m aura.ops.multi_agent_gate --check
      - name: Phase 10 CEO decision evidence drift
        run: python -m aura.ops.ceo_decision_gate --check
      - name: Phase 11 broker evidence readiness drift
        run: python -m aura.ops.broker_evidence_readiness --check
      - name: Phase 11 offline evidence intake smoke
        run: python -m aura.ops.broker_evidence_intake --output /tmp/aura-broker-intake.json
      - name: Phase 12 paper trading evidence drift
        run: python -m aura.ops.paper_trading_gate --check
      - name: Phase 13 operator interface evidence drift
        run: python -m aura.ops.operator_interface_gate --check
      - name: Phase 14 end-to-end evidence drift
        run: python -m aura.ops.end_to_end_gate --check
      - name: Ruff
        run: ruff check --output-format=github aura tests examples
      - name: Tests
        run: pytest
      - name: Production preflight smoke
        run: python examples/run_production_preflight.py --mode paper --connector public
      - name: Build distribution
        run: python -m build

  container-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build non-root production image
        run: docker build --tag aura-ai-os:ci .
