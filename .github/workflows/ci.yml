name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile smoke
        run: python -m compileall -q aura examples
      - name: Ruff
        run: ruff check --output-format=github aura tests examples
      - name: Tests
        run: pytest
      - name: Production preflight smoke
        run: python examples/run_production_preflight.py --mode paper --connector public
      - name: Build distribution
        run: python -m build

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root production image
        run: docker build --tag aura-ai-os:ci .
