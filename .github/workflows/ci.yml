name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff canonical diagnostic
        run: ruff check --fix --diff aura/models/registry.py aura/runtime/paper.py aura/runtime/multi_market_paper.py || true
      - name: Ruff
        run: ruff check --output-format=github aura tests examples
      - name: Tests
        run: pytest
