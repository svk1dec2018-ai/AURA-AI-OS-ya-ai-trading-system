name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile smoke
        run: python -m compileall -q aura examples
      - name: Phase 0 audit drift
        id: phase0-audit
        continue-on-error: true
        run: python -m aura.ops.repository_audit --check
      - name: Generate Phase 0 audit candidate
        if: steps.phase0-audit.outcome == 'failure'
        run: python -m aura.ops.repository_audit --write
      - name: Upload Phase 0 audit candidate
        if: steps.phase0-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase0-audit-candidate-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 1
          path: |
            artifacts/governance/repo_audit.json
            artifacts/governance/test_inventory.json
            artifacts/governance/module_map.md
      - name: Enforce Phase 0 audit
        if: steps.phase0-audit.outcome == 'failure'
        run: |
          echo "Phase 0 generated artifacts are stale. Download the candidate artifact and commit it."
          exit 1
      - name: Ruff
        run: ruff check --output-format=github aura tests examples
      - name: Tests
        run: pytest
      - name: Production preflight smoke
        run: python examples/run_production_preflight.py --mode paper --connector public
      - name: Build distribution
        run: python -m build

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build non-root production image
        run: docker build --tag aura-ai-os:ci .
