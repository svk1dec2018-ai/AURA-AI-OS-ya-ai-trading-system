name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dhan import diagnostic
        run: ruff check --select I001 --fix --diff tests/test_dhan_v2.py || true
      - name: Ruff
        run: ruff check --output-format=github aura tests examples
      - name: Tests
        run: pytest
