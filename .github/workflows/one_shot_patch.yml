name: one-shot-dhan-integration-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded exact edits
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/runtime/dhan_learning_daemon.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "        self.coordinator = coordinator\n        self.history_client = history_client\n",
                  "        self.coordinator = coordinator\n"
                  "        self.agent_risk_policy = (\n"
                  "            coordinator.scanner.agent_risk_policy or AgentRiskPolicy()\n"
                  "        )\n"
                  "        self.history_client = history_client\n",
              ),
              (
                  "        team = build_brain_policy_team(firewall, policy)\n",
                  "        team = build_brain_policy_team(\n"
                  "            firewall,\n"
                  "            policy,\n"
                  "            risk_policy=self.agent_risk_policy,\n"
                  "            min_top_of_book_notional=1.0,\n"
                  "        )\n",
              ),
              (
                  "            max_slippage_bps=config.max_slippage_bps,\n",
                  "            max_estimated_slippage_bps=config.max_slippage_bps,\n",
              ),
              (
                  "    async def _radar_loop(self) -> None:\n"
                  "        try:\n"
                  "            async for batch in self.broad_source.batches():\n"
                  "                if self._stop.is_set():\n"
                  "                    return\n"
                  "                one_minute = tuple(candle for candle in batch if candle.timeframe == \"1m\")\n"
                  "                if not one_minute:\n"
                  "                    continue\n"
                  "                open_positions = {\n"
                  "                    symbol\n"
                  "                    for symbol, position in self.coordinator.ledger.positions.items()\n"
                  "                    if position.quantity != 0\n"
                  "                }\n"
                  "                self.radar.set_priority_symbols(open_positions)\n"
                  "                selection = self.radar.observe(one_minute)\n"
                  "                self.counters.radar_batches += 1\n"
                  "                requested = selection.selected_tradable_symbols\n"
                  "                await self._seed_requested_symbols(requested)\n"
                  "                ready = tuple(symbol for symbol in requested if symbol in self._seeded_symbols)\n"
                  "                await self.deep_service.update_symbols(ready)\n"
                  "                self._write_status(None)\n"
                  "        except asyncio.CancelledError:\n"
                  "            raise\n",
                  "    async def _radar_loop(self) -> None:\n"
                  "        async for batch in self.broad_source.batches():\n"
                  "            if self._stop.is_set():\n"
                  "                return\n"
                  "            one_minute = tuple(\n"
                  "                candle for candle in batch if candle.timeframe == \"1m\"\n"
                  "            )\n"
                  "            if not one_minute:\n"
                  "                continue\n"
                  "            open_positions = {\n"
                  "                symbol\n"
                  "                for symbol, position in self.coordinator.ledger.positions.items()\n"
                  "                if position.quantity != 0\n"
                  "            }\n"
                  "            self.radar.set_priority_symbols(open_positions)\n"
                  "            selection = self.radar.observe(one_minute)\n"
                  "            self.counters.radar_batches += 1\n"
                  "            requested = selection.selected_tradable_symbols\n"
                  "            await self._seed_requested_symbols(requested)\n"
                  "            ready = tuple(\n"
                  "                symbol for symbol in requested if symbol in self._seeded_symbols\n"
                  "            )\n"
                  "            await self.deep_service.update_symbols(ready)\n"
                  "            self._write_status(None)\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guarded replacement expected 1 match, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one_shot_patch.yml").unlink()
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Format and validate patch
        run: |
          pip install -e ".[dev]"
          ruff check --fix aura/runtime/dhan_learning_daemon.py
          ruff check aura/runtime/dhan_learning_daemon.py
      - name: Commit patch and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura/runtime/dhan_learning_daemon.py .github/workflows/one_shot_patch.yml
          git commit -m "harden Dhan live evolution policy wiring"
          git push
