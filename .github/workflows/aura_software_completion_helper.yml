name: AURA software completion helper

on:
  push:
    branches:
      - agent/aura-governance-helper
    paths:
      - .github/workflows/aura_software_completion_helper.yml

permissions:
  contents: write

jobs:
  complete-software-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/software-completion-gates
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Patch dependency-aware governance and CI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura/ops/phase_gates.py")
          text = path.read_text()
          marker = "\n\ndef build_phase_zero_records("
          if "PHASE_DEPENDENCIES:" not in text:
              dependencies = '''\n\nPHASE_DEPENDENCIES: dict[int, tuple[int, ...]] = {\n    0: (),\n    1: (0,),\n    2: (1,),\n    3: (2,),\n    4: (3,),\n    5: (4,),\n    6: (5,),\n    7: (6,),\n    8: (7,),\n    9: (8,),\n    10: (9,),\n    11: (10,),\n    12: (10,),\n    13: (12,),\n    14: (12, 13),\n    15: (11, 14),\n}\n'''
              text = text.replace(marker, dependencies + marker)

          start = text.index("def build_sequential_phase_records(")
          end = text.index("\n\ndef validate_phase_gate_records", start)
          replacement = '''def build_sequential_phase_records(\n    root: Path,\n    evidence_by_phase: Mapping[int, Mapping[str, str]],\n) -> tuple[PhaseGateRecord, ...]:\n    \"\"\"Build a fail-closed dependency-aware ledger.\n\n    Phases 0-10 retain their strict chain. Phase 11 represents external live-broker\n    readiness and may remain BLOCKED while software-only phases 12-14 are validated.\n    Phase 15 requires both authentic Phase-11 evidence and Phase-14 completion.\n    \"\"\"\n\n    phases = tuple(sorted(evidence_by_phase))\n    if not phases:\n        raise ValueError("at least one phase evidence mapping is required")\n    if phases[0] < 0 or phases[-1] > 15:\n        raise ValueError("phase must be in [0, 15]")\n\n    records: list[PhaseGateRecord] = []\n    decisions: dict[int, GateDecision] = {}\n    for spec in PHASE_GATE_SPECS:\n        dependencies = PHASE_DEPENDENCIES[spec.phase]\n        blocked_dependencies = tuple(\n            dependency\n            for dependency in dependencies\n            if decisions.get(dependency) != GateDecision.PASS\n        )\n        evidence_paths = evidence_by_phase.get(spec.phase)\n        if evidence_paths is None:\n            reason = f"Phase {spec.phase} validation evidence has not been produced or accepted."\n            if blocked_dependencies:\n                reason += f" Required PASS dependencies: {list(blocked_dependencies)}."\n            record = PhaseGateRecord(\n                spec.phase,\n                GateDecision.BLOCKED,\n                reasons=(reason,),\n            )\n        elif blocked_dependencies:\n            record = PhaseGateRecord(\n                spec.phase,\n                GateDecision.BLOCKED,\n                reasons=(\n                    f"Phase {spec.phase} cannot PASS until dependencies "\n                    f"{list(blocked_dependencies)} are PASS.",\n                ),\n            )\n        else:\n            required = set(spec.validation_outputs)\n            if set(evidence_paths) != required:\n                raise ValueError(\n                    f"phase {spec.phase} evidence must exactly match its required outputs"\n                )\n            evidence = tuple(\n                GateEvidence(output, evidence_path, _file_sha256(\n                    _resolve_evidence_path(root, evidence_path)\n                ))\n                for output, evidence_path in sorted(evidence_paths.items())\n            )\n            record = PhaseGateRecord(spec.phase, GateDecision.PASS, evidence=evidence)\n        records.append(record)\n        decisions[spec.phase] = record.decision\n    return tuple(records)\n'''
          text = text[:start] + replacement + text[end:]

          old = '''            if record.phase > 0 and ordered[record.phase - 1].decision != GateDecision.PASS:\n                errors.append(f"phase {record.phase} cannot PASS before phase {record.phase - 1}")\n'''
          new = '''            for dependency in PHASE_DEPENDENCIES[record.phase]:\n                if ordered[dependency].decision != GateDecision.PASS:\n                    errors.append(\n                        f"phase {record.phase} cannot PASS before dependency {dependency}"\n                    )\n'''
          if old in text:
              text = text.replace(old, new)
          text = text.replace(
              '"policy": "AURA mandatory sequential phase gates 0-15",',
              '"policy": "AURA fail-closed dependency-aware phase gates 0-15",',
          )
          path.write_text(text)

          operator = Path("aura/ops/operator_interface_gate.py")
          operator_text = operator.read_text().replace(
              'calls: list[tuple[list[str], dict[str, Any]]] = []',
              'calls: list[tuple[tuple[str, ...], dict[str, Any]]] = []',
          ).replace(
              '"voice_uses_argument_vector": isinstance(command, list),',
              '"voice_uses_argument_vector": isinstance(command, tuple),',
          )
          operator.write_text(operator_text)

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text()
          anchor = '''      - name: Phase 11 offline evidence intake smoke\n        run: python -m aura.ops.broker_evidence_intake --output /tmp/aura-broker-intake.json\n'''
          addition = anchor + '''      - name: Phase 12 paper trading evidence drift\n        run: python -m aura.ops.paper_trading_gate --check\n      - name: Phase 13 operator interface evidence drift\n        run: python -m aura.ops.operator_interface_gate --check\n      - name: Phase 14 end-to-end evidence drift\n        run: python -m aura.ops.end_to_end_gate --check\n'''
          if "Phase 12 paper trading evidence drift" not in ci_text:
              ci_text = ci_text.replace(anchor, addition)
          ci.write_text(ci_text)
          PY
      - name: Compile and lint source changes
        run: |
          set -euo pipefail
          python -m compileall -q aura examples
          ruff check --output-format=github aura tests examples
      - name: Rebuild governance evidence through software Phase 14
        run: |
          set -euo pipefail
          python -m aura.ops.repository_audit --write
          python -m aura.ops.repository_audit --check
          python -m aura.ops.core_contracts --write
          python -m aura.ops.core_contracts --check
          python -m aura.ops.state_engine_gate --write
          python -m aura.ops.state_engine_gate --check
          python -m aura.ops.risk_engine_gate --write
          python -m aura.ops.risk_engine_gate --check
          python -m aura.ops.broker_conformance_gate --write
          python -m aura.ops.broker_conformance_gate --check
          python -m aura.ops.market_data_gate --write
          python -m aura.ops.market_data_gate --check
          python -m aura.ops.backtest_gate --write
          python -m aura.ops.backtest_gate --check
          python -m aura.ops.strategy_research_gate --write
          python -m aura.ops.strategy_research_gate --check
          python -m aura.ops.knowledge_rag_gate --write
          python -m aura.ops.knowledge_rag_gate --check
          python -m aura.ops.multi_agent_gate --write
          python -m aura.ops.multi_agent_gate --check
          python -m aura.ops.ceo_decision_gate --write
          python -m aura.ops.ceo_decision_gate --check
          python -m aura.ops.broker_evidence_readiness --write
          python -m aura.ops.broker_evidence_readiness --check
          python -m aura.ops.paper_trading_gate --write
          python -m aura.ops.paper_trading_gate --check
          python -m aura.ops.operator_interface_gate --write
          python -m aura.ops.operator_interface_gate --check
          python -m aura.ops.end_to_end_gate --write
          python -m aura.ops.end_to_end_gate --check
      - name: Full regression and production smoke
        run: |
          set -euo pipefail
          pytest -q
          python examples/run_production_preflight.py --mode paper --connector public
          python -m build
      - name: Commit verified software completion work
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- aura tests .github/workflows/ci.yml artifacts/governance
          git add -- aura/ops/paper_trading_gate.py aura/ops/operator_interface_gate.py aura/ops/end_to_end_gate.py tests/test_software_phase_dependencies.py artifacts/governance
          if git diff --cached --quiet; then
            echo "Software completion branch already current."
          else
            git commit -m "certify paper demo operator and end-to-end software phases"
            git push origin HEAD:agent/software-completion-gates
          fi
