name: ruff-autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply Ruff safe fixes
        run: ruff check --fix aura tests examples
      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples
          git commit -m "apply Ruff autofixes"
          git push
