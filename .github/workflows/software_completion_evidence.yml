name: software-completion-evidence

on:
  push:
    branches: [agent/software-completion-evidence-helper]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/software-completion-gates
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply final governance and CI compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path("aura/ops/phase_gates.py")
          text = gate.read_text(encoding="utf-8")
          old = '''            if blocked_dependencies:\n                errors.append(\n                    f"phase {record.phase} cannot PASS before dependencies "\n                    f"{list(blocked_dependencies)}"\n                )\n'''
          new = '''            if blocked_dependencies:\n                if blocked_dependencies == (record.phase - 1,):\n                    errors.append(\n                        f"phase {record.phase} cannot PASS before phase {record.phase - 1}"\n                    )\n                else:\n                    errors.append(\n                        f"phase {record.phase} cannot PASS before dependencies "\n                        f"{list(blocked_dependencies)}"\n                    )\n'''
          if old not in text:
              raise SystemExit("expected phase dependency validation block not found")
          gate.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = '''      - name: Phase 11 offline evidence intake smoke\n        run: python -m aura.ops.broker_evidence_intake --output /tmp/aura-broker-intake.json\n'''
          addition = marker + '''      - name: Phase 12 paper trading evidence drift\n        run: python -m aura.ops.paper_trading_gate --check\n      - name: Phase 13 operator interface evidence drift\n        run: python -m aura.ops.operator_interface_gate --check\n      - name: Phase 14 end-to-end evidence drift\n        run: python -m aura.ops.end_to_end_gate --check\n'''
          if "Phase 12 paper trading evidence drift" not in text:
              if marker not in text:
                  raise SystemExit("expected Phase 11 CI marker not found")
              workflow.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY
      - name: Normalize completion test imports
        run: ruff check --fix tests/test_software_phase_dependencies.py
      - name: Rebuild validated governance evidence
        run: |
          set -euo pipefail
          python -m aura.ops.repository_audit --write
          python -m aura.ops.core_contracts --write
          python -m aura.ops.state_engine_gate --write
          python -m aura.ops.risk_engine_gate --write
          python -m aura.ops.broker_conformance_gate --write
          python -m aura.ops.market_data_gate --write
          python -m aura.ops.backtest_gate --write
          python -m aura.ops.strategy_research_gate --write
          python -m aura.ops.knowledge_rag_gate --write
          python -m aura.ops.multi_agent_gate --write
          python -m aura.ops.ceo_decision_gate --write
          python -m aura.ops.broker_evidence_readiness --check
          python -m aura.ops.paper_trading_gate --write
          python -m aura.ops.operator_interface_gate --write
          python -m aura.ops.end_to_end_gate --write
      - name: Verify governance and regression suite
        run: |
          set -euo pipefail
          python -m aura.ops.repository_audit --check
          python -m aura.ops.core_contracts --check
          python -m aura.ops.state_engine_gate --check
          python -m aura.ops.risk_engine_gate --check
          python -m aura.ops.broker_conformance_gate --check
          python -m aura.ops.market_data_gate --check
          python -m aura.ops.backtest_gate --check
          python -m aura.ops.strategy_research_gate --check
          python -m aura.ops.knowledge_rag_gate --check
          python -m aura.ops.multi_agent_gate --check
          python -m aura.ops.ceo_decision_gate --check
          python -m aura.ops.broker_evidence_readiness --check
          python -m aura.ops.paper_trading_gate --check
          python -m aura.ops.operator_interface_gate --check
          python -m aura.ops.end_to_end_gate --check
          ruff check --output-format=github aura tests examples
          pytest
          python examples/run_production_preflight.py --mode paper --connector public
          python -m build
      - name: Commit validated completion state to target branch
        run: |
          set -euo pipefail
          git add \
            .github/workflows/ci.yml \
            aura/ops/phase_gates.py \
            tests/test_software_phase_dependencies.py \
            artifacts/governance
          if git diff --cached --quiet; then
            echo "Completion state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "validate Phase 12-14 software completion gates"
          git push origin HEAD:agent/software-completion-gates
