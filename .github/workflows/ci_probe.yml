name: ci-probe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Capture Ruff and pytest
        shell: bash
        run: |
          set +e
          ruff check aura tests examples > /tmp/ruff.txt 2>&1
          RUFF_EXIT=$?
          pytest -q > /tmp/pytest.txt 2>&1
          PYTEST_EXIT=$?
          set -e
          {
            echo "RUFF_EXIT=${RUFF_EXIT}"
            echo "PYTEST_EXIT=${PYTEST_EXIT}"
            echo "=== RUFF ==="
            cat /tmp/ruff.txt
            echo "=== PYTEST ==="
            cat /tmp/pytest.txt
          } > ci_probe_result.txt
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_probe_result.txt
          git commit -m "record final CI probe result"
          git push
