name: public-live-smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  live-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make autonomous warmup feature-aware
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/research/autonomous_strategy_lab.py")
          text = path.read_text(encoding="utf-8")
          old = '''    @property
    def warmup_bars(self) -> int:
        return max(
            self.slow_ema + 2,
            self.rsi_period + 2,
            self.momentum_lookback + 2,
            self.breakout_lookback + 2,
            self.band_lookback + 2,
            self.volume_lookback + 2,
            self.atr_lookback + 2,
        )
'''
          new = '''    @property
    def warmup_bars(self) -> int:
        requirements = [2]
        if "ema" in self.enabled_features:
            requirements.append(self.slow_ema + 2)
        if "rsi" in self.enabled_features:
            requirements.append(self.rsi_period + 2)
        if "momentum" in self.enabled_features:
            requirements.append(self.momentum_lookback + 2)
        if "breakout" in self.enabled_features:
            requirements.append(self.breakout_lookback + 2)
        if "bollinger" in self.enabled_features:
            requirements.append(self.band_lookback + 2)
        if "volume" in self.enabled_features:
            requirements.append(self.volume_lookback + 2)
        if "atr" in self.enabled_features:
            requirements.append(self.atr_lookback + 2)
        return max(requirements)
'''
          if text.count(old) != 1:
              raise SystemExit("autonomous warmup patch guard failed")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Static and unit validation
        shell: bash
        run: |
          pip install -e ".[dev]"
          ruff check --fix aura tests examples
          ruff check aura tests examples
          pytest -q
      - name: No-key live market smoke
        shell: bash
        run: |
          set +e
          rm -rf runtime/public_smoke
          timeout 75s python examples/run_free_public_strategy_lab.py \
            --provider coinbase \
            --population 32 \
            --max-ticks 5000 \
            --state-dir runtime/public_smoke/coinbase \
            >/tmp/coinbase.log 2>&1
          COINBASE=$?
          if [ "$COINBASE" -eq 0 ]; then
            PROVIDER=coinbase
            STATUS=runtime/public_smoke/coinbase/status.json
            LIVE=0
          else
            timeout 75s python examples/run_free_public_strategy_lab.py \
              --provider bybit \
              --symbols BTCUSDT ETHUSDT \
              --population 32 \
              --max-ticks 5000 \
              --state-dir runtime/public_smoke/bybit \
              >/tmp/bybit.log 2>&1
            BYBIT=$?
            if [ "$BYBIT" -eq 0 ]; then
              PROVIDER=bybit
              STATUS=runtime/public_smoke/bybit/status.json
              LIVE=0
            else
              PROVIDER=none
              STATUS=""
              LIVE=1
            fi
          fi
          set -e
          {
            echo "STATIC_RUFF=0"
            echo "PYTEST=0"
            echo "COINBASE_EXIT=${COINBASE}"
            echo "SELECTED_PROVIDER=${PROVIDER}"
            echo "LIVE_PUBLIC_SMOKE=${LIVE}"
            echo "=== COINBASE LOG ==="
            tail -n 30 /tmp/coinbase.log || true
            if [ -f /tmp/bybit.log ]; then
              echo "=== BYBIT LOG ==="
              tail -n 30 /tmp/bybit.log || true
            fi
            if [ -n "$STATUS" ] && [ -f "$STATUS" ]; then
              echo "=== LIVE STATUS ==="
              cat "$STATUS"
            fi
          } > public_live_smoke_result.txt
      - name: Commit source/result and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/public_live_smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples public_live_smoke_result.txt .github/workflows/public_live_smoke.yml
          git commit -m "validate no-key public live strategy learning"
          git push
