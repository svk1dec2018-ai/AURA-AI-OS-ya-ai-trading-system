name: aura-integration-phase0-fix

on:
  push:
    branches: [agent/aura-master-integration]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aura-master-integration
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Register lineage phase and regenerate Phase 0 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('aura/ops/repository_audit.py')
          text = path.read_text(encoding='utf-8')
          needle = '    "knowledge": 8,\n    "markets": 1,\n'
          replacement = '    "knowledge": 8,\n    "lineage": 10,\n    "markets": 1,\n'
          if '    "lineage": 10,\n' not in text:
              if needle not in text:
                  raise SystemExit('repository audit phase map anchor not found')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          rm .github/workflows/aura_integration_phase0_fix.yml
          python -m aura.ops.repository_audit --write
          python -m aura.ops.repository_audit --check
      - name: Commit repaired audit baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aura/ops/repository_audit.py artifacts/governance .github/workflows/aura_integration_phase0_fix.yml
          git commit -m 'classify lineage and refresh Phase 0 audit baseline'
          git push origin HEAD:agent/aura-master-integration
