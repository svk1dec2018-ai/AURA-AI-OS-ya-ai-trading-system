name: add-public-no-key-feeds

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Register public no-key feeds
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/connectors/catalog.py")
          text = path.read_text(encoding="utf-8")
          marker = '''        ConnectorDescriptor(
              connector_id="binance",
'''
          if marker not in text:
              raise SystemExit("catalog insertion marker not found")
          block = '''        ConnectorDescriptor(
              connector_id="coinbase_public",
              display_name="Coinbase Advanced Trade Public Market Data",
              kind=ConnectorKind.MARKET_DATA,
              regions=("GLOBAL",),
              markets=("CRYPTO",),
              capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL}),
              cost_tier=CostTier.FREE,
              maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,
              notes=("Public market-data channels require no API key; execution is not part of this connector.",),
          ),
          ConnectorDescriptor(
              connector_id="bybit_public",
              display_name="Bybit V5 Public Market Data",
              kind=ConnectorKind.MARKET_DATA,
              regions=("GLOBAL",),
              markets=("CRYPTO_SPOT", "CRYPTO_DERIVATIVES", "CRYPTO_OPTIONS"),
              capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.OPTIONS, Capability.OPEN_INTEREST}),
              cost_tier=CostTier.FREE,
              maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,
              notes=("Public V5 streams require no authentication; private/order channels are intentionally excluded.",),
          ),
          ConnectorDescriptor(
              connector_id="okx_public",
              display_name="OKX V5 Public Market Data",
              kind=ConnectorKind.MARKET_DATA,
              regions=("GLOBAL",),
              markets=("CRYPTO_SPOT", "CRYPTO_DERIVATIVES", "CRYPTO_OPTIONS"),
              capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.OPTIONS, Capability.OPEN_INTEREST}),
              cost_tier=CostTier.FREE,
              maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,
              notes=("Public market-data REST/WebSocket endpoints require no authentication; regional availability still applies.",),
          ),
'''
          text = text.replace(marker, block + marker, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_connector_catalog.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''    assert "dhan" not in ids
    assert "zerodha_kite" not in ids
'''
          new = '''    assert "dhan" not in ids
    assert "zerodha_kite" not in ids
    assert {"coinbase_public", "bybit_public", "okx_public"}.issubset(ids)
    assert DEFAULT_CONNECTOR_CATALOG.get("coinbase_public").required_env == ()
    assert DEFAULT_CONNECTOR_CATALOG.get("bybit_public").required_env == ()
    assert DEFAULT_CONNECTOR_CATALOG.get("okx_public").required_env == ()
'''
          if old not in tests:
              raise SystemExit("connector test insertion marker not found")
          test_path.write_text(tests.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/add_public_no_key_feeds.yml").unlink()
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          pip install -e ".[dev]"
          ruff check --fix aura tests examples
          ruff check aura tests examples
          pytest -q
      - name: Commit validated public feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples .github/workflows/add_public_no_key_feeds.yml
          git commit -m "register and validate public no-key market feeds"
          git push
