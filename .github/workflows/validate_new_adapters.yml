name: validate-new-adapters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update truthful connector maturity
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/connectors/catalog.py")
          text = path.read_text(encoding="utf-8")

          old = '''        ConnectorDescriptor(
            connector_id="flattrade",
            display_name="Flattrade Pi",
            kind=_BROKER,
            regions=("INDIA",),
            markets=("NSE", "BSE", "NFO", "CDS", "MCX"),
            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.OPTIONS, Capability.OPTION_CHAIN, Capability.OPEN_INTEREST}),
            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,
            maturity=ConnectorMaturity.RESEARCHED,
            notes=("Pi v2 execution use is subject to current exchange approval/static-IP rules.",),
        ),
'''
          new = '''        ConnectorDescriptor(
            connector_id="flattrade",
            display_name="Flattrade Pi",
            kind=_BROKER,
            regions=("INDIA",),
            markets=("NSE", "BSE", "NFO", "CDS", "MCX"),
            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.WEBSOCKET, Capability.DEPTH, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.OPTIONS, Capability.OPTION_CHAIN, Capability.OPEN_INTEREST}),
            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,
            maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,
            required_env=("AURA_FLATTRADE_USER_ID", "AURA_FLATTRADE_ACCOUNT_ID", "AURA_FLATTRADE_ACCESS_TOKEN"),
            notes=("AURA currently implements Pi v2 live touchline and TPSeries market data; execution remains disabled pending broker reconciliation/static-IP validation.",),
        ),
'''
          if text.count(old) != 1:
              raise SystemExit("Flattrade descriptor guard failed")
          text = text.replace(old, new)

          old = '''        ConnectorDescriptor(
            connector_id="oanda_v20",
            display_name="OANDA v20 REST API",
            kind=_BROKER,
            regions=("GLOBAL",),
            markets=("FOREX", "CFD"),
            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.DEMO}),
            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,
            maturity=ConnectorMaturity.RESEARCHED,
        ),
'''
          new = '''        ConnectorDescriptor(
            connector_id="oanda_v20",
            display_name="OANDA v20 REST API",
            kind=_BROKER,
            regions=("GLOBAL",),
            markets=("FOREX", "CFD"),
            capabilities=frozenset({Capability.LIVE_QUOTES, Capability.HISTORICAL, Capability.ORDERS, Capability.ORDER_UPDATES, Capability.POSITIONS, Capability.DEMO}),
            cost_tier=CostTier.FREE_ACCOUNT_REQUIRED,
            maturity=ConnectorMaturity.ADAPTER_IMPLEMENTED,
            required_env=("AURA_OANDA_ACCOUNT_ID", "AURA_OANDA_ACCESS_TOKEN"),
            notes=("AURA implements read-only v20 practice/live pricing and candle data; order routing is not enabled.",),
        ),
'''
          if text.count(old) != 1:
              raise SystemExit("OANDA descriptor guard failed")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/validate_new_adapters.yml").unlink()
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate and capture
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/ruff_fix 2>&1
          RUFF_FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${RUFF_FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 120 /tmp/pytest
          } > validate_new_adapters_result.txt
      - name: Commit patch and result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests .github/workflows/validate_new_adapters.yml validate_new_adapters_result.txt
          git commit -m "validate Flattrade and OANDA market data adapters"
          git push
