name: live-public-reliability-validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Add public-live reliability provenance and runtime wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"patch guard failed for {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "aura/evolution/brain_replay.py",
              '    LIVE_BROKER = "live_broker"\n    HISTORICAL = "historical"',
              '    LIVE_BROKER = "live_broker"\n    LIVE_PUBLIC = "live_public"\n    HISTORICAL = "historical"',
          )
          replace_once(
              "aura/evolution/shadow_outcomes.py",
              "        if self.reliability_tracker is None or self.origin != SampleOrigin.LIVE_BROKER:\n            return\n",
              "        if self.reliability_tracker is None or self.origin not in {\n            SampleOrigin.LIVE_BROKER,\n            SampleOrigin.LIVE_PUBLIC,\n        }:\n            return\n",
          )

          runtime = "aura/runtime/free_public_ai_council.py"
          replace_once(
              runtime,
              "from aura.agents.models import AgentContext\nfrom aura.agents.team import build_default_agent_team\n",
              "from aura.agents.models import AgentContext\nfrom aura.agents.reliability import AgentReliabilityTracker\nfrom aura.agents.team import build_default_agent_team\n",
          )
          replace_once(
              runtime,
              "from aura.domain.models import NormalizedCandle\nfrom aura.knowledge.firewall import KnowledgeFirewall\n",
              "from aura.domain.models import NormalizedCandle\nfrom aura.evolution.brain_online import BrainReplayStore\nfrom aura.evolution.brain_replay import SampleOrigin\nfrom aura.evolution.shadow_outcomes import (\n    ShadowDecisionOutcomeRecorder,\n    ShadowOutcomePolicy,\n)\nfrom aura.knowledge.firewall import KnowledgeFirewall\n",
          )
          replace_once(
              runtime,
              "        self.config = config or FreePublicAICouncilConfig()\n        self.config.state_dir.mkdir(parents=True, exist_ok=True)\n        team = build_default_agent_team(KnowledgeFirewall(), include_env_ai=True)\n",
              "        self.config = config or FreePublicAICouncilConfig()\n        self.config.state_dir.mkdir(parents=True, exist_ok=True)\n        brain_dir = self.config.state_dir / \"brain\"\n        self.reliability_tracker = AgentReliabilityTracker(\n            brain_dir / \"agent_reliability.jsonl\"\n        )\n        self.replay_store = BrainReplayStore(brain_dir / \"replay_samples.jsonl\")\n        self.recorder = ShadowDecisionOutcomeRecorder(\n            self.replay_store,\n            policy=ShadowOutcomePolicy(horizon_bars=5),\n            origin=SampleOrigin.LIVE_PUBLIC,\n            reliability_tracker=self.reliability_tracker,\n        )\n        team = build_default_agent_team(\n            KnowledgeFirewall(),\n            include_env_ai=True,\n            reliability_tracker=self.reliability_tracker,\n        )\n",
          )
          replace_once(
              runtime,
              "                completed = self.aggregator.on_tick(tick)\n                self.counters.closed_candles += len(completed)\n",
              "                completed = self.aggregator.on_tick(tick)\n                self.recorder.on_closed_candles(completed)\n                self.counters.closed_candles += len(completed)\n",
          )
          replace_once(
              runtime,
              "            result = await self.scanner.scan([context])\n        candidate = result.candidates[0]\n",
              "            result = await self.scanner.scan([context])\n        self.recorder.register_scan(result)\n        candidate = result.candidates[0]\n",
          )
          replace_once(
              runtime,
              '            "broker_orders_enabled": False,\n            "counters": {\n',
              '            "broker_orders_enabled": False,\n            "reliability_provenance": SampleOrigin.LIVE_PUBLIC.value,\n            "agent_reliability_observations": self.reliability_tracker.observation_count,\n            "pending_shadow_outcomes": self.recorder.pending_count,\n            "counters": {\n',
          )

          test = Path("tests/test_shadow_outcomes.py")
          text = test.read_text(encoding="utf-8")
          marker = "def test_agent_reliability_updates_only_from_material_live_broker_outcomes(\n"
          if marker not in text:
              raise SystemExit("shadow test append guard failed")
          append = '''\n\ndef test_public_live_origin_learns_reliability_without_claiming_broker_origin(\n    tmp_path: Path,\n) -> None:\n    now = datetime(2026, 8, 17, 11, 0, tzinfo=UTC)\n    tracker = AgentReliabilityTracker(tmp_path / "public_reliability.jsonl")\n    store = BrainReplayStore(tmp_path / "public_replay.jsonl")\n    recorder = ShadowDecisionOutcomeRecorder(\n        store,\n        policy=ShadowOutcomePolicy(horizon_bars=1, fallback_round_trip_cost_bps=2.0),\n        origin=SampleOrigin.LIVE_PUBLIC,\n        reliability_tracker=tracker,\n    )\n    assert recorder.register_scan(MarketScanResult(candidates=(_candidate(now),))) == 1\n    recorder.on_closed_candles((_candle(now + timedelta(minutes=1), "2020"),))\n    assert tracker.observation_count == 2\n    samples = store.read_all()\n    assert len(samples) == 1\n    assert samples[0].origin == SampleOrigin.LIVE_PUBLIC\n    assert samples[0].origin != SampleOrigin.LIVE_BROKER\n'''
          if "test_public_live_origin_learns_reliability_without_claiming_broker_origin" not in text:
              test.write_text(text + append, encoding="utf-8")
      - name: Validate full repository
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/fix 2>&1
          FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 220 /tmp/pytest
          } > live_public_reliability_validation.txt
      - name: Commit result and cleanup
        shell: bash
        run: |
          rm .github/workflows/live_public_reliability_validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples live_public_reliability_validation.txt .github/workflows/live_public_reliability_validation.yml
          git commit -m "learn contextual reliability from public live data"
          git push
