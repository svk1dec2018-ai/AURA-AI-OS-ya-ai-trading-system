name: ai-strategy-architect-gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Python 3.11
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/i311 2>&1
          I=$?
          ruff check aura tests examples >/tmp/r311 2>&1
          R=$?
          pytest -q >/tmp/p311 2>&1
          P=$?
          set -e
          {
            echo "PY311_INSTALL=${I}"
            echo "PY311_RUFF=${R}"
            echo "PY311_PYTEST=${P}"
            echo "=== PY311 RUFF ==="
            cat /tmp/r311
            echo "=== PY311 PYTEST ==="
            tail -n 240 /tmp/p311
          } > ai_strategy_architect_validation.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python 3.12
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/i312 2>&1
          I=$?
          ruff check aura tests examples >/tmp/r312 2>&1
          R=$?
          pytest -q >/tmp/p312 2>&1
          P=$?
          set -e
          {
            echo "PY312_INSTALL=${I}"
            echo "PY312_RUFF=${R}"
            echo "PY312_PYTEST=${P}"
            echo "=== PY312 RUFF ==="
            cat /tmp/r312
            echo "=== PY312 PYTEST ==="
            tail -n 240 /tmp/p312
          } >> ai_strategy_architect_validation.txt
      - name: Commit result and cleanup
        shell: bash
        run: |
          rm .github/workflows/ai_strategy_architect_gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_strategy_architect_validation.txt .github/workflows/ai_strategy_architect_gate.yml
          git commit -m "record AI strategy architect validation"
          git push
