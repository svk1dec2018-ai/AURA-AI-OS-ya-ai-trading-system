name: finalize-public-multi-ai

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply bounded backlog patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/runtime/free_public_ai_council.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from aura.data.candle_aggregation import NormalizedCandle, SessionCandleAggregator\n",
              "from aura.data.candle_aggregation import SessionCandleAggregator\nfrom aura.domain.models import NormalizedCandle\n",
          )
          text = text.replace(
              "    actionable_decisions: int = 0\n",
              "    actionable_decisions: int = 0\n    skipped_ai_due_capacity: int = 0\n",
          )
          old = """                    if self.bar_counts[key] % self.config.analyze_every_bars != 0:\n                        continue\n                    self._schedule_decision(candle)\n\n                self._collect_finished()\n"""
          new = """                    if self.bar_counts[key] % self.config.analyze_every_bars != 0:\n                        continue\n                    self._collect_finished()\n                    if len(self._inflight) >= self.config.max_inflight_ai_decisions:\n                        self.counters.skipped_ai_due_capacity += 1\n                        continue\n                    self._schedule_decision(candle)\n\n                self._collect_finished()\n"""
          if text.count(old) != 1:
              raise SystemExit("backlog patch guard failed")
          text = text.replace(old, new)
          text = text.replace(
              '                "actionable_decisions": self.counters.actionable_decisions,\n                "inflight": len(self._inflight),\n',
              '                "actionable_decisions": self.counters.actionable_decisions,\n                "skipped_ai_due_capacity": self.counters.skipped_ai_due_capacity,\n                "inflight": len(self._inflight),\n',
          )
          path.write_text(text, encoding="utf-8")
      - name: Validate complete repository
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/fix 2>&1
          FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 180 /tmp/pytest
          } > public_multi_ai_validation.txt
      - name: Commit result and cleanup
        shell: bash
        run: |
          rm .github/workflows/finalize_public_multi_ai.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples public_multi_ai_validation.txt .github/workflows/finalize_public_multi_ai.yml
          git commit -m "finalize public live multi AI council"
          git push
