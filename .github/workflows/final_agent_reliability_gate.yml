name: final-agent-reliability-gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate latest AURA
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/fix 2>&1
          FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 220 /tmp/pytest
          } > final_agent_reliability_validation.txt
      - name: Commit result and cleanup
        shell: bash
        run: |
          rm .github/workflows/final_agent_reliability_gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples final_agent_reliability_validation.txt .github/workflows/final_agent_reliability_gate.yml
          git commit -m "validate contextual agent reliability final state"
          git push
