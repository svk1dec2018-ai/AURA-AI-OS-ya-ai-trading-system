name: repair-autonomous-lab-final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and safe Ruff autofix
        shell: bash
        run: |
          pip install -e ".[dev]"
          ruff check --fix aura tests examples
      - name: Validate Python 3.11
        shell: bash
        run: |
          set +e
          ruff check aura tests examples >/tmp/r311 2>&1
          R311=$?
          pytest -q >/tmp/p311 2>&1
          P311=$?
          set -e
          {
            echo "PY311_RUFF=${R311}"
            echo "PY311_PYTEST=${P311}"
            echo "=== PY311 RUFF ==="
            cat /tmp/r311
            echo "=== PY311 PYTEST ==="
            tail -n 160 /tmp/p311
          } > autonomous_lab_final_validation_v2.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python 3.12
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/i312 2>&1
          I312=$?
          ruff check aura tests examples >/tmp/r312 2>&1
          R312=$?
          pytest -q >/tmp/p312 2>&1
          P312=$?
          set -e
          {
            echo "PY312_INSTALL=${I312}"
            echo "PY312_RUFF=${R312}"
            echo "PY312_PYTEST=${P312}"
            echo "=== PY312 RUFF ==="
            cat /tmp/r312
            echo "=== PY312 PYTEST ==="
            tail -n 160 /tmp/p312
          } >> autonomous_lab_final_validation_v2.txt
      - name: Commit repairs/result and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair_autonomous_lab_final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests examples autonomous_lab_final_validation_v2.txt .github/workflows/repair_autonomous_lab_final.yml
          git commit -m "repair and validate autonomous strategy lab final state"
          git push
