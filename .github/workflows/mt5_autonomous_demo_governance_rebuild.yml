name: mt5-autonomous-demo-governance-rebuild

on:
  push:
    branches:
      - agent/mt5-autonomous-demo-governance-helper

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: agent/mt5-autonomous-demo-bridge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate governance evidence
        run: |
          python -m aura.ops.repository_audit --write
          python -m aura.ops.core_contracts --write
          python -m aura.ops.state_engine_gate --write
          python -m aura.ops.risk_engine_gate --write
          python -m aura.ops.broker_conformance_gate --write
          python -m aura.ops.market_data_gate --write
          python -m aura.ops.backtest_gate --write
          python -m aura.ops.strategy_research_gate --write
          python -m aura.ops.knowledge_rag_gate --write
          python -m aura.ops.multi_agent_gate --write
          python -m aura.ops.ceo_decision_gate --write
          python -m aura.ops.broker_evidence_readiness --write
          python -m aura.ops.paper_trading_gate --write
          python -m aura.ops.operator_interface_gate --write
          python -m aura.ops.end_to_end_gate --write

      - name: Validate governance evidence
        run: |
          python -m aura.ops.repository_audit --check
          python -m aura.ops.core_contracts --check
          python -m aura.ops.state_engine_gate --check
          python -m aura.ops.risk_engine_gate --check
          python -m aura.ops.broker_conformance_gate --check
          python -m aura.ops.market_data_gate --check
          python -m aura.ops.backtest_gate --check
          python -m aura.ops.strategy_research_gate --check
          python -m aura.ops.knowledge_rag_gate --check
          python -m aura.ops.multi_agent_gate --check
          python -m aura.ops.ceo_decision_gate --check
          python -m aura.ops.broker_evidence_readiness --check
          python -m aura.ops.paper_trading_gate --check
          python -m aura.ops.operator_interface_gate --check
          python -m aura.ops.end_to_end_gate --check

      - name: Ruff
        run: ruff check --output-format=github aura tests examples

      - name: Full tests
        run: pytest

      - name: Paper preflight
        run: python examples/run_production_preflight.py --mode paper --connector public

      - name: Build distribution
        run: python -m build

      - name: Commit regenerated governance to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/governance
          if git diff --cached --quiet; then
            echo "No governance changes to commit"
            exit 0
          fi
          git commit -m "Refresh governance evidence for MT5 autonomous demo"
          git push origin HEAD:agent/mt5-autonomous-demo-bridge
