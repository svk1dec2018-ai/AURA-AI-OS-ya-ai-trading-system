name: fix-strategy-lab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path("aura/research/autonomous_strategy_lab.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from dataclasses import dataclass\n", "from dataclasses import dataclass, field\n")
          text = text.replace("from enum import Enum\n", "from enum import Enum\nfrom itertools import pairwise\n")
          text = text.replace("for prior, current in zip(window, window[1:]):", "for prior, current in pairwise(window):")
          text = text.replace("for prior, current in zip(candles, candles[1:]):", "for prior, current in pairwise(candles):")
          text = text.replace("base_policy: FitnessPolicy = FitnessPolicy()", "base_policy: FitnessPolicy = field(default_factory=FitnessPolicy)")
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_strategy_farm.py")
          body = test.read_text(encoding="utf-8")
          if "import pytest\n" not in body:
              body = "import pytest\n\n" + body
          marker = "async def test_strategy_farm_evaluates_population_and_counts_virtual_trades() -> None:"
          body = body.replace(marker, "@pytest.mark.asyncio\n" + marker)
          test.write_text(body, encoding="utf-8")
      - name: Validate and capture
        shell: bash
        run: |
          set +e
          pip install -e ".[dev]" >/tmp/install 2>&1
          INSTALL=$?
          ruff check --fix aura tests examples >/tmp/ruff_fix 2>&1
          RUFF_FIX=$?
          ruff check aura tests examples >/tmp/ruff 2>&1
          RUFF=$?
          pytest -q >/tmp/pytest 2>&1
          PYTEST=$?
          set -e
          {
            echo "INSTALL=${INSTALL}"
            echo "RUFF_FIX=${RUFF_FIX}"
            echo "RUFF=${RUFF}"
            echo "PYTEST=${PYTEST}"
            echo "=== RUFF ==="
            cat /tmp/ruff
            echo "=== PYTEST ==="
            tail -n 160 /tmp/pytest
          } > strategy_lab_validation_v2.txt
      - name: Commit repairs and result
        shell: bash
        run: |
          rm .github/workflows/fix_strategy_lab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura tests strategy_lab_validation_v2.txt .github/workflows/fix_strategy_lab.yml
          git commit -m "repair and validate autonomous strategy lab"
          git push
