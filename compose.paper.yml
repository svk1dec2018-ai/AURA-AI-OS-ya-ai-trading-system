name: aura-paper

services:
  aura-autonomy:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - examples/run_free_public_autonomy.py
      - --provider
      - ${AURA_PUBLIC_PROVIDER:-coinbase}
      - --timeframe
      - ${AURA_DECISION_TIMEFRAME:-5s}
      - --state-dir
      - /app/runtime/free_public_autonomy
    environment:
      AURA_OLLAMA_URL: ${AURA_OLLAMA_URL:-http://host.docker.internal:11434}
      AURA_FREE_AI_PRESET: ${AURA_FREE_AI_PRESET:-balanced5}
      AURA_OLLAMA_MODELS: ${AURA_OLLAMA_MODELS:-}
      AURA_OLLAMA_THINK: "false"
      AURA_OLLAMA_TIMEOUT_SECONDS: ${AURA_OLLAMA_TIMEOUT_SECONDS:-120}
      AURA_OLLAMA_MAX_CONCURRENCY: ${AURA_OLLAMA_MAX_CONCURRENCY:-1}
      AURA_OLLAMA_KEEP_ALIVE: ${AURA_OLLAMA_KEEP_ALIVE:-0}
      AURA_AI_OPINIONS_PER_ROLE: ${AURA_AI_OPINIONS_PER_ROLE:-1}
      AURA_AI_AGENT_TIMEOUT_SECONDS: ${AURA_AI_AGENT_TIMEOUT_SECONDS:-240}
      AURA_LIVE_TRADING_ENABLED: ""
      AURA_HUMAN_LIVE_APPROVAL_ID: ""
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - aura-paper-state:/app/runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  aura-paper-state:
